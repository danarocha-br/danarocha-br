name: Update profile cards

# Refetches the contribution data and re-renders the SVG cards in cards/.
# Runs once a day, whenever the generator or its config changes, and on demand.

on:
  schedule:
    - cron: "23 5 * * *" # 05:23 UTC every day
  workflow_dispatch: {}
  push:
    branches: [master]
    paths:
      - "profile.config.mjs"
      - "scripts/**"
      - "fonts/**"
      - ".github/workflows/update-profile-cards.yml"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch contribution data
        run: node scripts/fetch-data.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Render cards
        run: node scripts/render-cards.mjs

      - name: Commit the refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data cards README.md preview.html
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "chore: refresh profile cards"
            git push
          fi
